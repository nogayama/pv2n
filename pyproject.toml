[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pv2n"
version = "0.2.0"
description = "Presentation Video to Notes (PV2N) turns recorded presentations into structured, visual notes."
requires-python = ">=3.10"
readme = "README.md"
authors = [
  { name = "Takahide Nogayama" }
]

dependencies = [
    "toml",
    "opencv-python", # python >= 3.6
    "openai-whisper", # python >=3.8
    "scenedetect[opencv]", # python >=3.10
]

[project.optional-dependencies]
dev = [
  "yapf", # python >=3.7
]

[project.scripts]
pv2n = "pv2n.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pv2n.resources" = ["*.md"]
